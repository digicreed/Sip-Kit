group 'com.sipkit.sipkit_flutter'
version '0.1.0'

buildscript {
    ext.kotlin_version = '1.9.0'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // PJSIP AAR — add your Maven repo or use a local file dependency:
        // maven { url 'https://your-pjsip-maven-repo.com' }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion 34
    namespace 'com.sipkit.sipkit_flutter'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        // Keep the PJSUA2 bindings out of compilation unless the locally
        // packaged upstream AAR is present.  This makes the published plugin
        // usable by applications that do not ship native PJSIP.
        if (file('libs/pjsua2-2.14.aar').exists()) {
            main.java.srcDirs += 'src/pjsua2/kotlin'
        } else {
            main.java.srcDirs += 'src/no_pjsua2/kotlin'
        }
    }

    defaultConfig {
        minSdkVersion 23
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    if (file('libs/pjsua2-2.14.aar').exists()) {
        implementation files('libs/pjsua2-2.14.aar')
    }
    compileOnly 'androidx.core:core-ktx:1.12.0'
    // Firebase Cloud Messaging — declared compileOnly so the plugin compiles
    // against the FCM API surface without bundling it into the AAR.
    // The host app is responsible for adding the runtime dependency:
    //   implementation 'com.google.firebase:firebase-messaging:24.x.x'
    compileOnly 'com.google.firebase:firebase-messaging:24.1.1'
}
